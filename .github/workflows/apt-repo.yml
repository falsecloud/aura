name: APT repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish APT repository
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out APT pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-pages

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p debs
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir debs

      - name: Build signed repository
        run: |
          set -euo pipefail
          cd apt-pages

          rm -rf pool/main/a/aura-weather
          mkdir -p pool/main/a/aura-weather dists/stable/main/binary-amd64
          cp ../debs/*.deb pool/main/a/aura-weather/

          dpkg-scanpackages --multiversion pool \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          rm -f dists/stable/Release dists/stable/InRelease dists/stable/Release.gpg
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Aura" \
            -o APT::FTPArchive::Release::Label="Aura" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release

          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          test -n "$FPR"
          gpg --batch --yes --local-user "$FPR" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$FPR" \
            --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release

          cp ../packaging/apt/aura-archive-keyring.gpg .

      - name: Commit repository changes
        run: |
          set -euo pipefail
          cd apt-pages
          git config user.name "Aura Release Bot"
          git config user.email "319977598+falsecloud@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "APT repository is already up to date."
            exit 0
          fi
          git commit -m "Update APT repository for ${{ inputs.tag || github.event.release.tag_name }}"
          git push origin gh-pages
