name: APT repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  publish:
    name: Publish signed APT metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p repo
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir repo

      - name: Build signed flat repository
        run: |
          set -euo pipefail
          cd repo

          dpkg-scanpackages --multiversion . /dev/null > Packages
          sed -i 's|^Filename: \./|Filename: |' Packages
          gzip -9c Packages > Packages.gz

          rm -f Release InRelease Release.gpg
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Aura" \
            -o APT::FTPArchive::Release::Label="Aura" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > Release

          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          test -n "$FPR"
          gpg --batch --yes --local-user "$FPR" \
            --clearsign -o InRelease Release
          gpg --batch --yes --local-user "$FPR" \
            --armor --detach-sign -o Release.gpg Release

      - name: Upload APT metadata to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          cd repo
          cp ../packaging/apt/aura-archive-keyring.gpg .
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            Packages Packages.gz Release InRelease Release.gpg aura-archive-keyring.gpg
